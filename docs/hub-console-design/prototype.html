<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homer · 交互原型</title>
<style>
/* ============ design tokens ============ */
:root {
  --ink:      #1a1a1a;
  --ink-dim:  #6b6b6b;
  --line:     #e2e2e2;
  --bg:       #ffffff;
  --bg-sink:  #f6f6f6;
  --accent:   #0a7d4f;
  --accent-d: #086840;
  --danger:   #b3261e;
  --fs-hero:  1.5rem;
  --fs-body:  0.9375rem;
  --fs-small: 0.8125rem;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: var(--fs-body); color: var(--ink); }
body { margin: 0; background: var(--bg); line-height: 1.5; }
button { font: inherit; cursor: pointer; min-height: 40px; padding: 0 14px;
  background: var(--bg); color: var(--ink); border: 1px solid #bbb; border-radius: 4px; }
button:hover { border-color: var(--ink); }
button:active { background: var(--bg-sink); }
button:disabled { background: var(--bg-sink); color: var(--ink-dim); border-color: var(--line); cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-d); border-color: var(--accent-d); }
button.primary:active { background: #065536; }
button.text { border: none; background: none; color: var(--ink-dim); min-height: 32px; padding: 0 4px; }
button.text:hover { color: var(--ink); text-decoration: underline; }
button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; padding: 8px 10px; border: 1px solid #bbb; border-radius: 4px; min-height: 40px; width: 100%; }
input:hover { border-color: var(--ink); }
input[aria-invalid="true"] { border-color: var(--danger); }
code, pre, .mono { font-family: var(--mono); }
.muted { color: var(--ink-dim); }
.small { font-size: var(--fs-small); }
.hidden { display: none !important; }

/* ============ layout ============ */
.page { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }
header.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header.topbar h1 { font-size: 1.05rem; margin: 0; }
header.topbar .spacer { flex: 1; }
footer.statusline { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
  border-top: 1px solid var(--line); padding: 6px 16px; font-size: var(--fs-small);
  color: var(--ink-dim); display: flex; gap: 16px; align-items: center; }
footer.statusline .spacer { flex: 1; }

/* ============ hero banner ============ */
.hero { padding: 28px 0 20px; border-bottom: 1px solid var(--line); }
.hero .conclusion { font-size: var(--fs-hero); font-weight: 650; display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
.hero .numbers { color: var(--ink-dim); margin: 0 0 14px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--accent); }
.dot.drift { background: var(--accent); }
.dot.conflict { background: var(--danger); }
.dot.off { background: #b9b9b9; }
.hero.warn .conclusion { color: var(--danger); }
.hero-note { background: var(--bg-sink); border-left: 3px solid var(--danger); padding: 12px 14px; margin-top: 12px; }
.hero-note.info { border-left-color: var(--ink-dim); }

/* ============ sections ============ */
section { padding: 18px 0; border-bottom: 1px solid var(--line); }
section > h2 { font-size: var(--fs-small); text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-dim); margin: 0 0 10px; font-weight: 600; }

/* adapter rows */
.adapter-row { border-top: 1px solid var(--line); padding: 10px 4px; }
.adapter-row:first-of-type { border-top: none; }
.adapter-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.adapter-line .name { font-weight: 600; min-width: 5.5em; }
.adapter-line .counts { font-family: var(--mono); font-size: var(--fs-small); }
.adapter-line .counts .c-drift { color: var(--ink); }
.adapter-line .counts .c-conflict { color: var(--danger); font-weight: 700; }
.adapter-line .counts .c-clean { color: var(--ink-dim); }
.adapter-line .row-actions { margin-left: auto; display: flex; gap: 8px; }
.adapter-row.disabled-row { opacity: .55; }
.cat-line { display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 20px; font-size: var(--fs-small); flex-wrap: wrap; }
.cat-line .cat-name { font-family: var(--mono); min-width: 8em; color: var(--ink-dim); }
.cat-line .row-actions { margin-left: auto; }
button.small-btn { min-height: 32px; padding: 0 10px; font-size: var(--fs-small); }

/* diff drawer */
.diff-drawer { margin: 8px 0 8px 20px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.diff-drawer pre { margin: 0; padding: 12px; background: var(--bg-sink); font-size: 12.5px;
  overflow-x: auto; white-space: pre; line-height: 1.45; }
.diff-drawer .diff-actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
pre .ln-add { color: var(--accent); background: #0a7d4f14; display: block; }
pre .ln-del { color: var(--danger); background: #b3261e14; display: block; }
pre .ln-hunk { color: #0550ae; display: block; }
pre .ln-meta { color: var(--ink-dim); display: block; }

/* agents */
.agent-line { display: flex; align-items: baseline; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.agent-line:first-of-type { border-top: none; }
.agent-line .hostname { font-weight: 600; }
.agent-line .aid { font-family: var(--mono); font-size: var(--fs-small); color: var(--ink-dim); }
.agent-line .meta { font-size: var(--fs-small); color: var(--ink-dim); }
.agent-line.stale { opacity: .6; }
.agent-empty { padding: 14px 4px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

/* auth screens */
.gate { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
.gate h1 { font-size: 1.3rem; margin: 0 0 4px; }
.gate form { display: grid; gap: 12px; margin-top: 18px; }
.gate label { display: grid; gap: 4px; font-size: var(--fs-small); color: var(--ink-dim); }
.field-error { color: var(--danger); font-size: var(--fs-small); min-height: 1.2em; }
.inline-banner { border-left: 3px solid var(--danger); background: var(--bg-sink); padding: 10px 12px; margin: 14px 0 0; }
.inline-banner h3 { margin: 0 0 4px; font-size: var(--fs-body); }
.inline-banner ul { margin: 6px 0 0; padding-left: 1.2em; font-size: var(--fs-small); }
.inline-banner .close-x { float: right; }

/* toast */
#toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 4px;
  font-size: var(--fs-small); opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 30; }
#toast.show { opacity: 1; }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 4px; padding: 20px; max-width: 460px; width: calc(100% - 32px); }
dialog::backdrop { background: #0007; }
dialog h2 { margin: 0 0 8px; font-size: 1.1rem; }
dialog menu { display: flex; gap: 8px; justify-content: flex-end; padding: 0; margin: 18px 0 0; }
.join-cmd { display: flex; gap: 8px; margin: 12px 0; }
.join-cmd input { font-family: var(--mono); font-size: var(--fs-small); }

/* skeleton */
.skel { color: transparent !important; background: var(--bg-sink); border-radius: 4px;
  animation: pulse 1s infinite alternate; pointer-events: none; }
.skel * { visibility: hidden; }
@keyframes pulse { from { opacity: .7; } to { opacity: .35; } }

/* scenario switcher (prototype-only, NOT part of design) */
#scenario-bar { background: #111; color: #eee; padding: 8px 12px; display: flex; gap: 6px;
  flex-wrap: wrap; align-items: center; font-size: 12px; position: sticky; top: 0; z-index: 40; }
#scenario-bar .tag { background: var(--accent); color: #fff; padding: 1px 8px; border-radius: 99px; margin-right: 4px; }
#scenario-bar button { min-height: 26px; padding: 0 8px; font-size: 12px; background: #222; color: #ddd; border: 1px solid #444; border-radius: 3px; }
#scenario-bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
#scenario-bar button:hover { border-color: #888; }

@media (max-width: 639px) {
  .adapter-line .name { min-width: 0; }
  .adapter-line .row-actions { margin-left: 0; width: 100%; justify-content: flex-end; }
  .cat-line .row-actions { margin-left: auto; width: auto; }
  .hero .conclusion { font-size: 1.25rem; }
  .diff-drawer { margin-left: 0; }
  .cat-line { padding-left: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
html { scroll-behavior: smooth; }
</style>
</head>
<body>

<!-- ============ PROTOTYPE-ONLY scenario switcher ============ -->
<div id="scenario-bar" aria-hidden="false">
  <span class="tag">原型</span><span style="color:#888">此条仅为场景切换器，不属于设计</span><b>场景：</b>
  <button data-sc="gate-setup">首启·设密码</button>
  <button data-sc="gate-setup-code">首启·公网要码</button>
  <button data-sc="gate-login">登录</button>
  <button data-sc="notinit">未初始化</button>
  <button data-sc="clean" class="on">日常·干净</button>
  <button data-sc="drift">有漂移</button>
  <button data-sc="conflict">有冲突</button>
  <button data-sc="agents-empty">无机器</button>
  <button data-sc="agents-off">多机未启用</button>
  <button data-sc="loadfail">状态加载失败</button>
</div>

<!-- ============ header ============ -->
<header class="topbar">
  <h1>homer</h1>
  <span class="muted small" id="ver">v1.3.0</span>
  <span class="spacer"></span>
  <button class="text" id="btn-join-top" type="button">接入命令</button>
  <button class="text" id="btn-refresh" type="button">刷新</button>
  <button class="text" id="btn-logout" type="button">退出</button>
</header>

<div class="page">

  <!-- ============ auth gates (exclusive full-screen states) ============ -->
  <div id="gate-setup" class="gate hidden">
    <h1>设置管理员密码</h1>
    <p class="muted small">首次使用。密码至少 12 位，只存在这台 hub 上。</p>
    <form id="form-setup" novalidate>
      <label id="row-setup-code" class="hidden">初始化码（6 位，见 serve 启动日志）
        <input id="in-setup-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456">
      </label>
      <label>密码<input id="in-setup-pw" type="password" autocomplete="new-password"></label>
      <label>确认密码<input id="in-setup-pw2" type="password" autocomplete="new-password"></label>
      <div class="field-error" id="err-setup" role="alert"></div>
      <button type="submit" class="primary" id="btn-setup">保存并进入</button>
    </form>
  </div>

  <div id="gate-login" class="gate hidden">
    <h1>登录</h1>
    <p class="muted small" id="login-note">homer hub 控制台</p>
    <form id="form-login" novalidate>
      <label>管理员密码<input id="in-login-pw" type="password" autocomplete="current-password"></label>
      <div class="field-error" id="err-login" role="alert"></div>
      <button type="submit" class="primary" id="btn-login">登录</button>
    </form>
    <p class="muted small" style="margin-top:24px">忘记密码？删除 hub 上的 <code>~/.homer/hub/password</code> 后重启服务即可重设。</p>
  </div>

  <!-- ============ main workspace ============ -->
  <main id="workspace" class="hidden">

    <!-- ① HERO: the only thing that matters on first paint -->
    <div class="hero" id="hero" aria-live="polite"></div>

    <!-- page-level alert (secrets rejected / failures) -->
    <div id="alert-slot"></div>

    <!-- ② adapters -->
    <section id="sec-adapters" aria-label="适配器明细">
      <h2>适配器明细</h2>
      <div id="adapter-list"></div>
    </section>

    <!-- ③ machines -->
    <section id="sec-agents" aria-label="机器">
      <h2>机器</h2>
      <div id="agent-list"></div>
    </section>

  </main>
</div>

<!-- ============ footer status line ============ -->
<footer class="statusline">
  <span id="refreshed-at">—</span>
  <span class="muted">每 30s 自动刷新</span>
  <span class="spacer"></span>
  <span class="muted">hub · 本机</span>
</footer>

<div id="toast" role="status"></div>

<!-- ============ confirm dialog (push/pull) ============ -->
<dialog id="dlg-confirm">
  <form method="dialog" style="margin:0">
    <h2 id="confirm-title">确认</h2>
    <p id="confirm-desc"></p>
    <p class="muted small">受影响文件会先备份。</p>
    <menu>
      <button value="cancel" id="btn-confirm-cancel">取消</button>
      <button value="confirm" class="primary" id="btn-confirm-ok">确认</button>
    </menu>
  </form>
</dialog>

<!-- ============ join dialog ============ -->
<dialog id="dlg-join">
  <h2>接入新机器</h2>
  <p class="muted small">在新机器的终端运行这条命令，接入后会出现在机器列表。</p>
  <div class="join-cmd">
    <input id="join-cmd" readonly aria-label="接入命令">
    <button id="btn-copy" type="button">复制</button>
  </div>
  <p class="muted small hidden" id="copy-fallback">当前环境不支持自动复制：已全选文本，请按 Ctrl+C。</p>
  <menu><button value="ok" class="primary">完成</button></menu>
</dialog>

<script>
"use strict";
/* =====================================================================
 * MOCK BACKEND — 忠实复刻真实 API 语义（冻结，不改）
 * GET  /api/auth/status   {configured, setupCodeRequired}
 * POST /api/auth/setup    {password, setupCode?}
 * POST /api/auth/login    {password}
 * POST /api/auth/logout
 * GET  /api/auth/join     {command}
 * GET  /api/health        {version}
 * GET  /api/status        {report:{adapters:[{id,push,pull,conflicts,categories:[{name,push,pull,conflicts}]}], errors, warnings, disabled}}
 * GET  /api/diff?adapter&category  {empty, text}
 * POST /api/push?confirm=true | /api/pull?confirm=true
 * GET  /api/agents        {agents:[{agentId,hostname,mode,lastSeen,stale}]}
 * 错误: 401 / 409(code=not-initialized|aborted|conflicts) / 422(secrets-rejected)
 * =================================================================== */
const MOCK = (() => {
  const netDelay = () => new Promise(r => setTimeout(r, 180 + Math.random() * 320));

  // --- mutable mock world ---
  const world = {
    configured: true, setupCodeRequired: false, authed: false,
    initialized: true,
    agentsEnabled: true,
    statusFails: false,
    adapters: [
      { id: "pi",      push: 0, pull: 0, conflicts: 0, categories: [
        { name: "settings", push: 0, pull: 0, conflicts: 0 },
        { name: "agents",   push: 0, pull: 0, conflicts: 0 } ]},
      { id: "herdr",   push: 0, pull: 0, conflicts: 0, categories: [
        { name: "settings", push: 0, pull: 0, conflicts: 0 } ]},
      { id: "opencode",push: 0, pull: 0, conflicts: 0, categories: [] },
      { id: "ghostty", push: 0, pull: 0, conflicts: 0, categories: [
        { name: "settings", push: 0, pull: 0, conflicts: 0 } ]},
    ],
    disabled: ["opencode"],
    agents: [
      { agentId: "agt_9f2ka", hostname: "nj-mac",  mode: "connect", lastSeen: "2 分钟前", stale: false },
      { agentId: "agt_31xqb", hostname: "nj-hw",   mode: "listen",  lastSeen: "8 分钟前", stale: false },
      { agentId: "agt_77old", hostname: "old-box", mode: "connect", lastSeen: "3 天前",  stale: true },
    ],
  };

  const DIFFS = {
    "pi/settings":
`diff --git a/pi/settings.json b/pi/settings.json
--- a/pi/settings.json
+++ b/pi/settings.json
@@ -12,7 +12,8 @@
   "models": {
-    "default": "claude-sonnet-4"
+    "default": "claude-opus-4.1",
+    "fallback": "gpt-5.2"
   },
   "extensions": [
@@ -31,4 +32,3 @@
-    "old-tool"
   ]`,
    "pi/agents":
`diff --git a/pi/agents/reviewer.md b/pi/agents/reviewer.md
--- a/pi/agents/reviewer.md
+++ b/pi/agents/reviewer.md
@@ -1,5 +1,5 @@
 # reviewer
-角度: 正确性
+角度: 正确性 + 回归
 输出: verdict JSON`,
    "herdr/settings":
`diff --git a/herdr/config.toml b/herdr/config.toml
--- a/herdr/config.toml
+++ b/herdr/config.toml
@@ -3,3 +3,4 @@
 [server]
 port = 8080
+log_level = "debug"`,
  };
  DIFFS[""] = Object.values(DIFFS).filter(v => typeof v === "string").join("\n\n");

  function errBody(status, code, message, details) {
    return { status, body: { ok: false, error: { code, message, details: details || [] } } };
  }

  async function route(method, path, body) {
    await netDelay();
    const url = new URL(path, "http://mock");
    const p = url.pathname;

    if (p === "/api/auth/status")
      return { status: 200, body: { configured: world.configured, setupCodeRequired: world.setupCodeRequired } };

    if (p === "/api/auth/setup" && method === "POST") {
      if (world.setupCodeRequired && body.setupCode !== "482910")
        return errBody(403, "setup-code-required", "初始化码缺失或错误（提示：试试 482910）");
      if ((body.password || "").length < 12)
        return errBody(422, "weak-password", "密码至少 12 位");
      world.configured = true; world.authed = true;
      return { status: 200, body: { ok: true } };
    }
    if (p === "/api/auth/login" && method === "POST") {
      if (body.password === "homer-homer") { world.authed = true; return { status: 200, body: { ok: true } }; }
      return errBody(401, "bad-credentials", "密码错误（原型密码：homer-homer）");
    }
    if (p === "/api/auth/logout" && method === "POST") {
      world.authed = false; return { status: 200, body: { ok: true } };
    }

    // ---- everything below requires auth ----
    if (!world.authed) return errBody(401, "unauthorized", "未登录或会话已过期");

    if (p === "/api/auth/join")
      return { status: 200, body: { command: "HOMER_HUB_TOKEN=hk_9f2ka71xm0q8 homer agent --connect http://192.168.1.10:8080" } };
    if (p === "/api/health")
      return { status: 200, body: { ok: true, status: "healthy", version: "1.3.0" } };

    if (p === "/api/status") {
      if (world.statusFails) return errBody(500, "internal", "扫描配置目录失败：permission denied");
      if (!world.initialized) return errBody(409, "not-initialized", "请先运行 homer init 完成初始化");
      return { status: 200, body: { ok: true, report: {
        adapters: world.adapters.map(a => ({ ...a, categories: a.categories.map(c => ({ ...c })) })),
        errors: [], warnings: [], disabled: world.disabled.slice(),
      } } };
    }

    if (p === "/api/diff") {
      const a = url.searchParams.get("adapter") || "", c = url.searchParams.get("category") || "";
      const text = DIFFS[a + "/" + c] || DIFFS[a] || "";
      const adapter = world.adapters.find(x => x.id === a);
      const hasDrift = a ? (adapter && (adapter.push + adapter.pull + adapter.conflicts) > 0)
                         : world.adapters.some(x => x.push + x.pull + x.conflicts > 0);
      return { status: 200, body: { ok: true, empty: !hasDrift, text: hasDrift ? (text || "diff --git …\n（mock diff）") : "" } };
    }

    if ((p === "/api/push" || p === "/api/pull") && method === "POST") {
      const isPush = p === "/api/push";
      const conflicts = world.adapters.reduce((s, a) => s + a.conflicts, 0);
      if (conflicts > 0) return errBody(409, "conflicts", "存在冲突，请在终端运行 homer merge");
      // demo: pushing while pi/settings has drift → secrets found
      if (isPush && world.adapters[0].categories[0].push === 2) {
        return { status: 422, body: { ok: false, status: "secrets-rejected",
          errors: ["pi/settings.json:14 疑似 age 私钥（AGE-SECRET-KEY-1…）", "pi/settings.json:15 疑似 token（hk_live_…）"] } };
      }
      // success: clear drift in that direction
      let n = 0;
      world.adapters.forEach(a => {
        if (isPush) { n += a.push; a.push = 0; } else { n += a.pull; a.pull = 0; }
        a.categories.forEach(c => { if (isPush) c.push = 0; else c.pull = 0; });
      });
      return { status: 200, body: { ok: true, status: isPush ? "pushed" : "applied",
        changedFiles: Array.from({ length: n }, (_, i) => ({ path: "file-" + i })),
        applied: { written: [], deleted: [] }, warnings: [], errors: [] } };
    }

    if (p === "/api/agents") {
      if (!world.agentsEnabled) return errBody(501, "agents-disabled", "多机 agent 视图未启用");
      return { status: 200, body: { ok: true, agents: world.agents.map(a => ({ ...a })) } };
    }
    return errBody(404, "not-found", "请求的资源不存在");
  }

  // --- scenarios: configure the mock world ---
  function scenario(name) {
    // reset
    world.configured = true; world.setupCodeRequired = false; world.authed = true;
    world.initialized = true; world.agentsEnabled = true; world.statusFails = false;
    world.agents = [
      { agentId: "agt_9f2ka", hostname: "nj-mac",  mode: "connect", lastSeen: "2 分钟前", stale: false },
      { agentId: "agt_31xqb", hostname: "nj-hw",   mode: "listen",  lastSeen: "8 分钟前", stale: false },
      { agentId: "agt_77old", hostname: "old-box", mode: "connect", lastSeen: "3 天前",  stale: true },
    ];
    world.adapters.forEach(a => { a.push = a.pull = a.conflicts = 0; a.categories.forEach(c => { c.push = c.pull = c.conflicts = 0; }); });

    switch (name) {
      case "gate-setup": world.configured = false; world.authed = false; break;
      case "gate-setup-code": world.configured = false; world.setupCodeRequired = true; world.authed = false; break;
      case "gate-login": world.authed = false; break;
      case "notinit": world.initialized = false; break;
      case "clean": break;
      case "drift":
        world.adapters[0].push = 2; world.adapters[0].pull = 1;
        world.adapters[0].categories[0].push = 2;
        world.adapters[0].categories[1].pull = 1;
        world.adapters[1].pull = 1; world.adapters[1].categories[0].pull = 1;
        break;
      case "conflict":
        world.adapters[0].push = 1; world.adapters[0].conflicts = 1;
        world.adapters[0].categories[0].push = 1;
        world.adapters[0].categories[1].conflicts = 1;
        break;
      case "agents-empty": world.agents = []; break;
      case "agents-off": world.agentsEnabled = false; break;
      case "loadfail": world.statusFails = true; break;
    }
    return name;
  }

  return { route, scenario, world };
})();

/* =====================================================================
 * APP — 结构与 INTERACTION.md 一一对应：
 *   gate（独占全屏）/ workspace（hero → alert → adapters → agents）
 * =================================================================== */
const $ = id => document.getElementById(id);
const app = {
  report: null,           // 最近一次 /api/status 的 report
  pendingAction: null,    // push/pull 待确认
  openDiffs: new Set(),   // 展开的 diff 抽屉，key = adapter/category（轮询不重置）
  joining: null,
};

async function api(path, opts = {}) {
  const res = await MOCK.route(opts.method || "GET", path, opts.body || {});
  if (res.status >= 400) {
    const b = res.body;
    if (b.error) {
      const e = new Error(b.error.message || ("请求失败（" + res.status + "）"));
      e.status = res.status; e.code = b.error.code; e.errors = b.error.details || [];
      throw e;
    }
    // 写操作的失败报告信封（真实后端同源行为：ok:false + status + errors，HTTP 409/422）
    const e = new Error((b.errors || []).join("；") || "操作未完成");
    e.status = res.status; e.code = b.status; e.errors = b.errors || []; e.report = b;
    throw e;
  }
  return res.body;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}
function fmtCounts(push, pull, conflicts) {
  const parts = [];
  if (push) parts.push("↑" + push + " 可推送");
  if (pull) parts.push("↓" + pull + " 可拉取");
  if (conflicts) parts.push("⚡" + conflicts + " 冲突");
  return parts.join(" · ");
}

/* ---------- ① hero ---------- */
function renderHero() {
  const hero = $("hero"); clear(hero); hero.classList.remove("warn");
  const r = app.report;
  let push = 0, pull = 0, conflicts = 0;
  (r.adapters || []).forEach(a => { push += a.push || 0; pull += a.pull || 0; conflicts += a.conflicts || 0; });

  const numbers = el("p", "numbers");

  if (conflicts > 0) {
    hero.classList.add("warn");
    concl.append(el("span", "dot conflict"), document.createTextNode("有冲突，需要终端处理"));
    numbers.textContent = conflicts + " 个冲突" + (push + pull ? "，另有 " + fmtCounts(push, pull, 0) : "");
    const note = el("div", "hero-note");
    note.append(el("div", null, "冲突无法用网页解决。在终端运行："));

      r.adapters.filter(a => a.push + a.pull > 0).length + " 个适配器";

    btn.type = "button";

      r.adapters.forEach(a => { if (a.push + a.pull > 0) app.openDiffs.add("__row__" + a.id); });
      renderAdapters();
      $("sec-adapters").scrollIntoView({ behavior: "smooth", block: "start" });
    });
    hero.append(concl, numbers, btn);

/* ---------- ② adapters ---------- */
function countCls(push, pull, conflicts) {
  if (conflicts) return "counts c-conflict";
  if (push + pull) return "counts c-drift";
  return "counts c-clean";
}
function renderAdapters() {
  const list = $("adapter-list"); clear(list);
  const r = app.report;
  const totalDrift = (r.adapters || []).reduce((s, a) => s + a.push + a.pull + a.conflicts, 0);

  if (totalDrift === 0 && !app._adaptersTouched) {
    // 干净态：整个区块收成一行，可展开但不主动展开
    const row = el("div", "adapter-line");
    row.append(el("span", "name muted", (r.adapters || []).map(a => a.id).join(" / ") + "　全部干净"));
    const btn = el("button", "text", "展开明细 ▾");
    btn.type = "button";
    btn.addEventListener("click", () => { app._adaptersTouched = true; renderAdapters(); });
    row.append(el("span", "row-actions")); row.lastChild.append(btn);
    const wrap = el("div", "adapter-row"); wrap.append(row); list.append(wrap);
    return;
  }

  (r.adapters || []).forEach(a => {
    const disabled = (r.disabled || []).includes(a.id);
    const wrap = el("div", "adapter-row" + (disabled ? " disabled-row" : ""));
    const line = el("div", "adapter-line");
    line.append(el("span", "name", a.id));
    const cText = disabled ? "已禁用" : (a.push + a.pull + a.conflicts ? fmtCounts(a.push, a.pull, a.conflicts) : "干净");
    line.append(el("span", countCls(a.push, a.pull, a.conflicts), cText));
    const acts = el("span", "row-actions");
    const driftBtn = el("button", "small-btn", (a.push + a.pull + a.conflicts ? "查看差异" : "明细 ▾"));
    driftBtn.type = "button";
    const rowKey = "__row__" + a.id;
    driftBtn.setAttribute("aria-expanded", app.openDiffs.has(rowKey));
    driftBtn.addEventListener("click", () => {
      app.openDiffs.has(rowKey) ? app.openDiffs.delete(rowKey) : app.openDiffs.add(rowKey);
      renderAdapters();
    });
    acts.append(driftBtn);
    line.append(acts);
    wrap.append(line);

    if (app.openDiffs.has(rowKey)) {
      (a.categories || []).forEach(c => {
        const cl = el("div", "cat-line");
        cl.append(el("span", "cat-name", c.name));
        cl.append(el("span", countCls(c.push, c.pull, c.conflicts),
          c.push + c.pull + c.conflicts ? fmtCounts(c.push, c.pull, c.conflicts) : "干净"));
        const cActs = el("span", "row-actions");
        if (c.push + c.pull + c.conflicts > 0) {
          const db = el("button", "small-btn", "差异");
          db.type = "button";
          const key = a.id + "/" + c.name;
          db.setAttribute("aria-expanded", app.openDiffs.has(key));
          db.setAttribute("aria-controls", "diff-" + key.replace(/\W/g, "-"));
          db.addEventListener("click", () => toggleDiff(a.id, c.name));
          cActs.append(db);
        }
        cl.append(cActs);
        wrap.append(cl);
        const key = a.id + "/" + c.name;
        if (app.openDiffs.has(key)) wrap.append(buildDiffDrawer(a.id, c.name));
      });
      if (!(a.categories || []).length) wrap.append(el("div", "cat-line muted", "无分类数据"));
    }
    list.append(wrap);
  });
}

function buildDiffDrawer(adapter, category) {
  const key = adapter + "/" + category;
  const drawer = el("div", "diff-drawer");
  drawer.id = "diff-" + key.replace(/\W/g, "-");
  const pre = el("pre", null, "加载差异…");
  drawer.append(pre);
  api("/api/diff?adapter=" + encodeURIComponent(adapter) + "&category=" + encodeURIComponent(category))
    .then(d => {
      clear(pre);
      if (d.empty) { pre.textContent = "无漂移"; return; }
      // diff 着色：语义编码（+=仓库将新增 / -=将被覆盖），不是装饰
      d.text.split("\n").forEach(line => {
        const cls = line.startsWith("+++") || line.startsWith("---") || line.startsWith("diff ") ? "ln-meta"
          : line.startsWith("@@") ? "ln-hunk"
          : line.startsWith("+") ? "ln-add"
          : line.startsWith("-") ? "ln-del" : "";
        const span = el("span", cls, line);
        pre.append(span, document.createTextNode("\n"));
      });
    })
    .catch(e => {
      clear(pre);
      pre.append(el("span", null, "差异加载失败：" + e.message + "　"));
      const retry = el("button", "small-btn", "重试");
      retry.type = "button";
      retry.addEventListener("click", () => { renderAdapters(); });
      pre.append(retry);
    });
  if (app.report) {
    const a = app.report.adapters.find(x => x.id === adapter);
    const c = a && a.categories.find(x => x.name === category);
    if (c) {
      const actions = el("div", "diff-actions");
      if (c.push > 0 && !hasConflicts()) {
        const pb = el("button", "primary", "推送本机改动（↑" + c.push + "）");
        pb.type = "button"; pb.addEventListener("click", () => confirmWrite("push"));
        actions.append(pb);
      }
      if (c.pull > 0 && !hasConflicts()) {
        const pl = el("button", null, "拉取仓库改动（↓" + c.pull + "）");
        pl.type = "button"; pl.addEventListener("click", () => confirmWrite("pull"));
        actions.append(pl);
      }
      if (c.conflicts > 0) actions.append(el("span", "small muted", "冲突需终端 homer merge，此处仅查看"));
      if (actions.childNodes.length) drawer.append(actions);
    }
  }
  return drawer;
}
function toggleDiff(adapter, category) {
  const key = adapter + "/" + category;
  app.openDiffs.has(key) ? app.openDiffs.delete(key) : app.openDiffs.add(key);
  renderAdapters();
}
function hasConflicts() {
  return (app.report?.adapters || []).some(a => a.conflicts > 0);
}

/* ---------- ③ agents ---------- */
function renderAgents(agents, disabledFeature) {

function renderAgentsError(msg) {
  const list = $("agent-list"); clear(list);
  const box = el("div", "small");
  box.append(el("span", null, "机器列表加载失败：" + msg + "　"));

async function loadAgents() {
  const btn = $("btn-join-top");
  try {
    const d = await api("/api/agents");
    btn.classList.remove("hidden");      // 功能可用 → 恢复入口（renderAgents 渲染前定下终态）
    renderAgents(d.agents || [], false);
  } catch (e) {
    if (e.code === "agents-disabled") {
      btn.classList.add("hidden");       // 功能没开 → 隐藏入口（与 renderAgents 分支一致）
      renderAgents([], true);
    }
    else if (e.status === 401) return;   // 401 由 refresh 统一处理
    else renderAgentsError(e.message);
  }
}

/* ---------- write actions: push / pull ---------- */
function confirmWrite(action) {
  const r = app.report;
  const n = (r.adapters || []).reduce((s, a) => s + (action === "push" ? a.push : a.pull), 0);
  $("confirm-title").textContent = action === "push" ? "确认推送" : "确认拉取";
  $("confirm-desc").textContent = action === "push"
    ? "推送 " + n + " 项改动到仓库（以本机为准）。"
    : "拉取 " + n + " 项改动到本机（覆盖本地文件前先备份）。";
  $("btn-confirm-ok").textContent = action === "push" ? "确认推送" : "确认拉取";
  app.pendingAction = action;
  $("dlg-confirm").showModal();
}
$("dlg-confirm").addEventListener("close", () => { app.pendingAction = null; });
// 显式接线，不依赖 dialog 表单的隐式提交行为（兼容性兜底）
$("btn-confirm-ok").addEventListener("click", ev => {
  ev.preventDefault();
  const okBtn = $("btn-confirm-ok");
  okBtn.disabled = true; okBtn.textContent = "处理中…";
  // 直接执行（close→事件→fetch 的链路在 headless 环境会丢事件），
  // 然后关对话框；真实浏览器与 headless 行为一致
  $("dlg-confirm").returnValue = "confirm";
  const action = app.pendingAction;
  $("dlg-confirm").close("confirm");
  app.pendingAction = null;
  if (action) executeWrite(action);
});
$("btn-confirm-cancel").addEventListener("click", ev => {
  ev.preventDefault();
  $("dlg-confirm").close("cancel");
});
async function executeWrite(action) {
  const okBtn = $("btn-confirm-ok"); okBtn.disabled = true; okBtn.textContent = "处理中…";
  try {
    const d = await api("/api/" + action + "?confirm=true", { method: "POST" });
    const n = (d.changedFiles || []).length || (d.applied?.written || []).length;
    toast((action === "push" ? "推送成功" : "拉取成功") + "，处理 " + n + " 个文件");
    clearAlert();
    await refresh();
  } catch (e) {
    if (e.status === 422 || e.code === "secrets-rejected") {
      showAlert("推送被拒绝：检测到疑似密钥", e.errors, "确认不是密钥后请在终端用 homer push --allow-secrets 处理。");
    } else if (e.code === "conflicts") {
      toast("存在冲突，请终端 homer merge");
      await refresh();
    } else {
      showAlert((action === "push" ? "推送" : "拉取") + "未完成", e.errors.length ? e.errors : [e.message], null);
    }
  } finally {
    okBtn.disabled = false;
  }
}

/* ---------- refresh orchestration ---------- */
function stampRefresh(failed) {
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, "0"), mm = String(t.getMinutes()).padStart(2, "0"), ss = String(t.getSeconds()).padStart(2, "0");
  $("refreshed-at").textContent = failed
    ? hh + ":" + mm + " 刷新失败，下次自动重试"
    : hh + ":" + mm + ":" + ss + " 已刷新";
  $("refreshed-at").style.color = failed ? "var(--ink-dim)" : "";
}

async function refresh() {
  try {
    const status = await api("/api/status");
    showWorkspace();
    app.report = status.report;
    $("sec-adapters").classList.remove("hidden");
    renderHero();
    renderAdapters();
    stampRefresh(false);
  } catch (e) {
    if (e.status === 401) {
      showGate("login", "会话已过期，请重新登录");
      return;
    }
    showWorkspace();
    if (e.code === "not-initialized") {
      app.report = null;
      const hero = $("hero"); clear(hero); hero.classList.remove("warn");
      const concl = el("p", "conclusion"); concl.append(el("span", "dot off"), document.createTextNode("尚未初始化"));
      hero.append(concl, el("p", "numbers", "homer 还没在这台机器上初始化"));
      const note = el("div", "hero-note info");
      note.append(el("div", null, "在终端运行："));
      note.append(el("div", "mono", "$ homer init"));
      note.append(el("div", "small muted", "完成后回到这里点右上角「刷新」。"));
      hero.append(note);
      clear($("adapter-list")); $("sec-adapters").classList.add("hidden");
    } else {
      // 其他失败：保留旧数据（若有），页级提示 + footer 变灰
      if (!app.report) renderHeroError(e.message);
      else { renderHero(); renderAdapters(); }
    }
    stampRefresh(true);
  }
  await loadAgents();
}
function renderHeroError(msg) {
  const hero = $("hero"); clear(hero); hero.classList.remove("warn"); hero.classList.add("warn");
  const concl = el("p", "conclusion");
  concl.append(el("span", "dot conflict"), document.createTextNode("状态加载失败"));
  hero.append(concl, el("p", "numbers", msg));
  const retry = el("button", null, "重试");
  retry.type = "button"; retry.addEventListener("click", refresh);
  hero.append(retry);
}

});
$("form-login").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("err-login"); err.textContent = "";
  const btn = $("btn-login"); btn.disabled = true; btn.textContent = "登录中…";
  try {
    await MOCK.route("POST", "/api/auth/login", { password: $("in-login-pw").value }).then(r => {
      if (r.status >= 400) throw new Error(r.body.error.message);
    });
    $("in-login-pw").value = "";
    toast("已登录");
    await refresh();
  } catch (e) {
    err.textContent = e.message;
    $("in-login-pw").setAttribute("aria-invalid", "true");
    $("in-login-pw").focus();
  } finally { btn.disabled = false; btn.textContent = "登录"; }
});
$("btn-logout").addEventListener("click", async () => {
  await MOCK.route("POST", "/api/auth/logout", {});
  app.report = null; app.openDiffs.clear(); app._adaptersTouched = false;
  showGate("login");
});
$("btn-refresh").addEventListener("click", refresh);

/* ---------- boot & scenario wiring (prototype only) ---------- */
async function boot() {
  const gate = await api("/api/auth/status");
  if (!gate.configured) {
    showGate("setup");
    $("row-setup-code").classList.toggle("hidden", !gate.setupCodeRequired);
    return;
  }
  if (!MOCK.world.authed) { showGate("login"); return; }
  await refresh();
}
document.querySelectorAll("#scenario-bar button").forEach(b => {
  b.addEventListener("click", async () => {
    document.querySelectorAll("#scenario-bar button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    app.report = null; app.openDiffs.clear(); app._adaptersTouched = false;
    clearAlert();
    $("sec-adapters").classList.remove("hidden");
    MOCK.scenario(b.dataset.sc);
    await boot();
  });
});
boot();
</script>
</body>
</html>
