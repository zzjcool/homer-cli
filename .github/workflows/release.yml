name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test install.sh from dist
        env:
          HOME: ${{ runner.temp }}/homer-install/home
          HOMER_INSTALL_BASE_URL: file://${{ github.workspace }}/dist
          HOMER_INSTALL_PREFIX: ${{ runner.temp }}/homer-install/bin
        run: |
          mkdir -p "$HOME" "$HOMER_INSTALL_PREFIX"
          sh ./install.sh
          "$HOMER_INSTALL_PREFIX/homer" --help >/dev/null
