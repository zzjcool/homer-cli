<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homer</title>
<style>
/* ============ design tokens ============ */
:root {
  --ink:      #1a1a1a;
  --ink-dim:  #6b6b6b;
  --line:     #e2e2e2;
  --bg:       #ffffff;
  --bg-sink:  #f6f6f6;
  --accent:   #0a7d4f;
  --accent-d: #086840;
  --danger:   #b3261e;
  --fs-hero:  1.5rem;
  --fs-body:  0.9375rem;
  --fs-small: 0.8125rem;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: var(--fs-body); color: var(--ink); }
body { margin: 0; background: var(--bg); line-height: 1.5; }
button { font: inherit; cursor: pointer; min-height: 40px; padding: 0 14px;
  background: var(--bg); color: var(--ink); border: 1px solid #bbb; border-radius: 4px; }
button:hover { border-color: var(--ink); }
button:active { background: var(--bg-sink); }
button:disabled { background: var(--bg-sink); color: var(--ink-dim); border-color: var(--line); cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { background: var(--accent-d); border-color: var(--accent-d); }
button.primary:active { background: #065536; }
button.text { border: none; background: none; color: var(--ink-dim); min-height: 32px; padding: 0 4px; }
button.text:hover { color: var(--ink); text-decoration: underline; }
button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; padding: 8px 10px; border: 1px solid #bbb; border-radius: 4px; min-height: 40px; width: 100%; }
input:hover { border-color: var(--ink); }
input[aria-invalid="true"] { border-color: var(--danger); }
code, pre, .mono { font-family: var(--mono); }
.muted { color: var(--ink-dim); }
.small { font-size: var(--fs-small); }
.hidden { display: none !important; }

/* ============ layout ============ */
.page { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }
header.topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header.topbar h1 { font-size: 1.05rem; margin: 0; }
header.topbar .spacer { flex: 1; }
footer.statusline { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
  border-top: 1px solid var(--line); padding: 6px 16px; font-size: var(--fs-small);
  color: var(--ink-dim); display: flex; gap: 16px; align-items: center; }
footer.statusline .spacer { flex: 1; }

/* ============ hero banner ============ */
.hero { padding: 28px 0 20px; border-bottom: 1px solid var(--line); }
.hero .conclusion { font-size: var(--fs-hero); font-weight: 650; display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
.hero .numbers { color: var(--ink-dim); margin: 0 0 14px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.dot.ok { background: var(--accent); }
.dot.drift { background: var(--accent); }
.dot.conflict { background: var(--danger); }
.dot.off { background: #b9b9b9; }
.hero.warn .conclusion { color: var(--danger); }
.hero-note { background: var(--bg-sink); border-left: 3px solid var(--danger); padding: 12px 14px; margin-top: 12px; }
.hero-note.info { border-left-color: var(--ink-dim); }

/* ============ sections ============ */
section { padding: 18px 0; border-bottom: 1px solid var(--line); }
section > h2 { font-size: var(--fs-small); text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-dim); margin: 0 0 10px; font-weight: 600; }

/* adapter rows */
.adapter-row { border-top: 1px solid var(--line); padding: 10px 4px; }
.adapter-row:first-of-type { border-top: none; }
.adapter-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.adapter-line .name { font-weight: 600; min-width: 5.5em; }
.adapter-line .counts { font-family: var(--mono); font-size: var(--fs-small); }
.adapter-line .counts .c-drift { color: var(--ink); }
.adapter-line .counts .c-conflict { color: var(--danger); font-weight: 700; }
.adapter-line .counts .c-clean { color: var(--ink-dim); }
.adapter-line .row-actions { margin-left: auto; display: flex; gap: 8px; }
.adapter-row.disabled-row { opacity: .55; }
.cat-line { display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 20px; font-size: var(--fs-small); flex-wrap: wrap; }
.cat-line .cat-name { font-family: var(--mono); min-width: 8em; color: var(--ink-dim); }
.cat-line .row-actions { margin-left: auto; }
button.small-btn { min-height: 32px; padding: 0 10px; font-size: var(--fs-small); }
button.danger-btn { color: var(--danger); border-color: var(--danger); }
button.danger-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

/* diff drawer */
.diff-drawer { margin: 8px 0 8px 20px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.diff-drawer pre { margin: 0; padding: 12px; background: var(--bg-sink); font-size: 12.5px;
  overflow-x: auto; white-space: pre; line-height: 1.45; }
.diff-drawer .diff-actions { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
pre .ln-add { color: var(--accent); background: #0a7d4f14; display: block; }
pre .ln-del { color: var(--danger); background: #b3261e14; display: block; }
pre .ln-hunk { color: #0550ae; display: block; }
pre .ln-meta { color: var(--ink-dim); display: block; }

/* agents */
.agent-line { display: flex; align-items: baseline; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.agent-line:first-of-type { border-top: none; }
.agent-line .hostname { font-weight: 600; }
.agent-line .aid { font-family: var(--mono); font-size: var(--fs-small); color: var(--ink-dim); }
.agent-line .meta { font-size: var(--fs-small); color: var(--ink-dim); }
.agent-line.stale { opacity: .6; }
.agent-empty { padding: 14px 4px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

/* auth screens */
.gate { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
.gate h1 { font-size: 1.3rem; margin: 0 0 4px; }
.gate form { display: grid; gap: 12px; margin-top: 18px; }
.gate label { display: grid; gap: 4px; font-size: var(--fs-small); color: var(--ink-dim); }
.field-error { color: var(--danger); font-size: var(--fs-small); min-height: 1.2em; }
.inline-banner { border-left: 3px solid var(--danger); background: var(--bg-sink); padding: 10px 12px; margin: 14px 0 0; }
.inline-banner h3 { margin: 0 0 4px; font-size: var(--fs-body); }
.inline-banner ul { margin: 6px 0 0; padding-left: 1.2em; font-size: var(--fs-small); }
.inline-banner .close-x { float: right; }

/* toast */
#toast { position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 4px;
  font-size: var(--fs-small); opacity: 0; transition: opacity .18s; pointer-events: none; z-index: 30; }
#toast.show { opacity: 1; }

/* dialogs */
dialog { border: 1px solid var(--line); border-radius: 4px; padding: 20px; max-width: 460px; width: calc(100% - 32px); }
dialog::backdrop { background: #0007; }
dialog h2 { margin: 0 0 8px; font-size: 1.1rem; }
dialog menu { display: flex; gap: 8px; justify-content: flex-end; padding: 0; margin: 18px 0 0; }
.join-cmd { display: flex; gap: 8px; margin: 12px 0; }
.join-cmd input { font-family: var(--mono); font-size: var(--fs-small); }

/* skeleton */
.skel { color: transparent !important; background: var(--bg-sink); border-radius: 4px;
  animation: pulse 1s infinite alternate; pointer-events: none; }
.skel * { visibility: hidden; }
@keyframes pulse { from { opacity: .7; } to { opacity: .35; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
html { scroll-behavior: smooth; }
</style>
</head>
<body>


<!-- ============ header ============ -->
<header class="topbar">
  <h1>homer</h1>
  <span class="muted small" id="ver">v1.3.0</span>
  <span class="spacer"></span>
  <button class="text" id="btn-join-top" type="button">接入命令</button>
  <button class="text" id="btn-refresh" type="button">刷新</button>
  <button class="text" id="btn-logout" type="button">退出</button>
</header>

<div class="page">

  <!-- ============ auth gates (exclusive full-screen states) ============ -->
  <div id="gate-setup" class="gate hidden">
    <h1>设置管理员密码</h1>
    <p class="muted small">首次使用。密码至少 12 位，只存在这台 hub 上。</p>
    <form id="form-setup" novalidate>
      <label id="row-setup-code" class="hidden">初始化码（6 位，见 serve 启动日志）
        <input id="in-setup-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="123456">
      </label>
      <label>密码<input id="in-setup-pw" type="password" autocomplete="new-password"></label>
      <label>确认密码<input id="in-setup-pw2" type="password" autocomplete="new-password"></label>
      <div class="field-error" id="err-setup" role="alert"></div>
      <button type="submit" class="primary" id="btn-setup">保存并进入</button>
    </form>
  </div>

  <div id="gate-login" class="gate hidden">
    <h1>登录</h1>
    <p class="muted small" id="login-note">homer hub 控制台</p>
    <form id="form-login" novalidate>
      <label>管理员密码<input id="in-login-pw" type="password" autocomplete="current-password"></label>
      <div class="field-error" id="err-login" role="alert"></div>
      <button type="submit" class="primary" id="btn-login">登录</button>
    </form>
    <p class="muted small" style="margin-top:24px">忘记密码？删除 hub 上的 <code>~/.homer/hub/password</code> 后重启服务即可重设。</p>
  </div>

  <!-- ============ main workspace ============ -->
  <main id="workspace" class="hidden">

    <!-- ① HERO: the only thing that matters on first paint -->
    <div class="hero" id="hero" aria-live="polite"></div>

    <!-- page-level alert (secrets rejected / failures) -->
    <div id="alert-slot"></div>

    <!-- ③ machines -->
    <section id="sec-agents" aria-label="机器">
      <h2>机器</h2>
      <div id="agent-list"></div>
    </section>

  </main>
</div>

<!-- ============ footer status line ============ -->
<footer class="statusline">
  <span id="refreshed-at">—</span>
  <span class="muted">每 30s 自动刷新</span>
  <span class="spacer"></span>
  <span class="muted">hub · 本机</span>
</footer>

<div id="toast" role="status"></div>

<!-- ============ confirm dialog (push/pull) ============ -->
<dialog id="dlg-confirm">
  <form method="dialog" style="margin:0">
    <h2 id="confirm-title">确认</h2>
    <p id="confirm-desc"></p>
    <div id="confirm-choices"></div>
    <p class="muted small">受影响文件会先备份。</p>
    <menu>
      <button value="cancel" id="btn-confirm-cancel">取消</button>
      <button value="confirm" class="primary" id="btn-confirm-ok">确认</button>
    </menu>
  </form>
</dialog>

<!-- ============ join dialog ============ -->
<dialog id="dlg-join">
  <h2>接入新机器</h2>
  <p class="muted small">在新机器的终端运行这条命令，接入后会出现在机器列表。</p>
  <div class="join-cmd">
    <input id="join-cmd" readonly aria-label="接入命令">
    <button id="btn-copy" type="button">复制</button>
  </div>
  <p class="muted small hidden" id="copy-fallback">当前环境不支持自动复制：已全选文本，请按 Ctrl+C。</p>
  <menu><button value="ok" class="primary">完成</button></menu>
</dialog>

<script>
"use strict";
const $ = id => document.getElementById(id);
/* =====================================================================
 * homer hub console — API contract (frozen):
 * GET  /api/auth/status   {configured, setupCodeRequired}
 * POST /api/auth/setup    {password, setupCode?}
 * POST /api/auth/login    {password}
 * POST /api/auth/logout
 * GET  /api/auth/join     {command}
 * GET  /api/health        {version}
 * GET  /api/console       {published, generation, machines:[{agentId,hostname,stale,drift:{push,pull,conflicts}}]}
 * GET  /api/status        {report:{...}} (机器视角的兼容端点)
 * GET  /api/diff?adapter&category  {empty, text}
 * POST /api/sync?direction=collect&agent=<id>&confirm=true   收取一台机器
 * POST /api/sync?direction=dispatch&confirm=true             下发给所有在线机器
 * POST /api/resolve?choice=local|center&agent=<id>&confirm=true  在某台机器上裁决
 * GET  /api/agents        {agents:[{agentId,hostname,mode,lastSeen,stale,drift}]}
 * 错误: 401 / 409(code=not-initialized|aborted|conflicts) / 422(secrets-rejected)
 * =================================================================== */
const app = {
  console: null,          // 最近一次 /api/console 的存储视角
  pendingAction: null,    // 收取/下发/裁决 待确认
  openDiffs: new Set(),   // 展开的 diff 抽屉，key = adapter/category（轮询不重置）
};

async function api(path, opts = {}) {
  const init = { method: opts.method || "GET", credentials: "same-origin", headers: { "Accept": "application/json" } };
  if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  const res = await fetch(path, init);
  let data = null;
  try { data = await res.json(); } catch (_) { data = {}; }
  if (!res.ok) {
    const err = data.error || {};
    const e = new Error(err.message || ("请求失败（" + res.status + "）"));
    e.status = res.status; e.code = err.code; e.errors = err.details || [];
    // 写操作失败信封（ok:false + status + errors，HTTP 409/422）
    if (!err.message && data.errors) {
      e.message = (data.errors || []).join("；") || "操作未完成";
      e.code = data.status; e.errors = data.errors || []; e.report = data;
    }
    throw e;
  }
  return data;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove("show"), 2600);
}
function fmtCounts(push, pull, conflicts) {
  const parts = [];
  if (push) parts.push("↑" + push + " 项本机改动");
  if (pull) parts.push("↓" + pull + " 项中心改动");
  if (conflicts) parts.push(conflicts + " 项冲突");
  return parts.join(" · ");
}

/* ---------- gates ---------- */
function showGate(which, note) {
  $("workspace").classList.add("hidden");
  $("gate-setup").classList.toggle("hidden", which !== "setup");
  $("gate-login").classList.toggle("hidden", which !== "login");
  $("btn-join-top").classList.add("hidden"); $("btn-refresh").classList.add("hidden"); $("btn-logout").classList.add("hidden");
  if (which === "login") {
    $("login-note").textContent = note || "homer hub 控制台";
    setTimeout(() => $("in-login-pw").focus(), 0);
  }
  if (which === "setup") setTimeout(() => $("in-setup-pw").focus(), 0);
}
function showWorkspace() {
  $("gate-setup").classList.add("hidden"); $("gate-login").classList.add("hidden");
  $("workspace").classList.remove("hidden");
  $("btn-join-top").classList.remove("hidden"); $("btn-refresh").classList.remove("hidden"); $("btn-logout").classList.remove("hidden");
}

/* ---------- ① hero: the server's storage view ---------- */
function fmtDrift(d) {
  const parts = [];
  if (d.push) parts.push("↑" + d.push + " 项未收取");
  if (d.pull) parts.push("↓" + d.pull + " 项待下发");
  if (d.conflicts) parts.push(d.conflicts + " 项冲突");
  return parts.join(" · ");
}
function renderHero() {
  const hero = $("hero"); clear(hero); hero.classList.remove("warn");
  const c = app.console;
  if (!c) return;

  // First run: nothing in the storage yet — the story starts by
  // collecting the first machine's content.
  if (!c.published) {
    const machines = c.machines || [];
    const concl = el("p", "conclusion");
    concl.append(el("span", "dot off"), document.createTextNode("中心还没有任何内容"));
    const numbers = el("p", "numbers", machines.length
      ? "已接入 " + machines.length + " 台机器 · 从一台机器收取它的配置，存入中心"
      : "还没有机器接入 · 先接入一台机器，再从它收取配置");
    hero.append(concl, numbers);
    return;
  }

  // Aggregate the fleet's drift relative to the storage.
  let push = 0, pull = 0, conflicts = 0, online = 0;
  (c.machines || []).forEach(m => {
    if (m.stale) return;
    online++;
    if (!m.drift) return;
    push += m.drift.push || 0;
    pull += m.drift.pull || 0;
    conflicts += m.drift.conflicts || 0;
  });
  const all = (c.machines || []).length;

  const concl = el("p", "conclusion");
  const numbers = el("p", "numbers");

  if (conflicts > 0) {
    hero.classList.add("warn");
    concl.append(el("span", "dot conflict"), document.createTextNode("有冲突，需要选择保留哪一边"));
    numbers.textContent = conflicts + " 项冲突 · 存储 第 " + c.generation + " 代";
    const note = el("div", "hero-note");
    note.append(el("div", null, "某台机器和中心改了同一处。到那台机器所在行选择保留哪一边。"));
    hero.append(concl, numbers, note);
    return;
  }
  if (push + pull > 0) {
    concl.append(el("span", "dot drift"), document.createTextNode("有尚未同步的改动"));
    const parts = [];
    if (push) parts.push("↑" + push + " 项未收取");
    if (pull) parts.push("↓" + pull + " 项待下发");
    numbers.textContent = parts.join(" · ") + " · 存储 第 " + c.generation + " 代 · 在线 " + online + "/" + all;
    const btn = el("button", "primary", "处理改动");
    btn.type = "button";
    btn.addEventListener("click", confirmStorageSync);
    hero.append(concl, numbers, btn);
    return;
  }
  concl.append(el("span", "dot ok"), document.createTextNode("全部对齐"));
  numbers.textContent = "存储 第 " + c.generation + " 代 · " + all + " 台机器全部干净 · 在线 " + online + "/" + all;
  hero.append(concl, numbers);
}

function renderHeroSkeleton() {
  const hero = $("hero"); clear(hero);
  const concl = el("p", "conclusion skel", "加载中加载中");
  const numbers = el("p", "numbers skel", "加载中加载中加载中加载中");
  hero.append(concl, numbers);
}

/* ---------- ③ agents ---------- */
function renderAgents(agents, disabledFeature) {
  const list = $("agent-list"); clear(list);
  if (disabledFeature) {
    list.append(el("div", "muted small", "多机视图未启用（serve 未开 agent 模式）"));
    return;
  }
  if (!agents.length) {
    const box = el("div", "agent-empty");
    box.append(el("span", "muted", "还没有机器接入"));
    const btn = el("button", "primary", "＋ 接入新机器");
    btn.type = "button"; btn.addEventListener("click", openJoin);
    box.append(btn);
    list.append(box);
    return;
  }
  agents.forEach(a => {
    const line = el("div", "agent-line" + (a.stale ? " stale" : ""));
    line.append(el("span", "dot " + (a.stale ? "off" : "ok")));
    line.append(el("span", "hostname", a.hostname));
    line.append(el("span", "aid", a.agentId));
    // 该机器相对存储的漂移（它自己每次心跳上报）
    if (a.drift) {
      const d = a.drift;
      if (d.error && d.error.indexOf("homer") >= 0 && d.error.indexOf("init") >= 0) {
        // 全新机器还没有自己的配置——不是故障，是等待第一次下发
        line.append(el("span", "counts c-clean", "新机器 · 等待下发"));
      } else if (d.error) {
        line.append(el("span", "small muted", "状态上报失败"));
      } else if (d.push + d.pull + d.conflicts > 0) {
        line.append(el("span", "counts " + (d.conflicts ? "c-conflict" : "c-drift"), fmtDrift(d)));
      } else {
        line.append(el("span", "counts c-clean", "已对齐"));
      }
    } else {
      line.append(el("span", "small muted", a.stale ? "离线期间不产生同步" : "等待首次心跳…"));
    }
    line.append(el("span", "meta",
      (a.mode === "listen" ? "直连" : "主动连接") + " · " + a.lastSeen + (a.stale ? " · 离线" : "")));

    // 收取：让这台机器把它的配置上传到中心存储
    const collectBtn = el("button", "small-btn", "收取");
    collectBtn.type = "button";
    collectBtn.title = "把这台机器的配置存入中心";
    collectBtn.disabled = a.stale;
    collectBtn.addEventListener("click", () => confirmCollect(a));
    line.append(collectBtn);

    // 下发：让这台机器应用中心存储的当前内容
    const dispatchBtn = el("button", "small-btn", "下发");
    dispatchBtn.type = "button";
    dispatchBtn.title = "把中心的内容下发到这台机器";
    dispatchBtn.disabled = a.stale;
    dispatchBtn.addEventListener("click", () => confirmDispatch(a));
    line.append(dispatchBtn);

    // 冲突裁决：这台机器有冲突时给出二选一
    if (a.drift && a.drift.conflicts > 0 && !a.stale) {
      const localBtn = el("button", "small-btn danger-btn", "以这台机器为准");
      localBtn.type = "button";
      localBtn.addEventListener("click", () => confirmResolveOn("local", a));
      const centerBtn = el("button", "small-btn", "以中心为准");
      centerBtn.type = "button";
      centerBtn.addEventListener("click", () => confirmResolveOn("center", a));
      line.append(localBtn, centerBtn);
    }

    // 吊销：Tailscale 式单机踢除（凭证失效，行保留观察）。
    const revoke = el("button", "small-btn danger-btn", "吊销");
    revoke.type = "button";
    revoke.title = "吊销该机器的接入凭证（其下次心跳立即失效；不影响其他机器）";
    revoke.addEventListener("click", async () => {
      if (!confirm("吊销 " + (a.hostname || a.agentId) + "?\n该机器将立即失去接入权限（重新接入需生成新接入码）。")) return;
      try {
        await api("/api/agents/revoke", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agentId: a.agentId }) });
        toast("已吊销 " + (a.hostname || a.agentId));
        await refresh();
      } catch (e) { toast("吊销失败：" + e.message); }
    });
    // 移除：吊销凭证 + 从列表彻底删除（离线机器清理路径）。
    const removeBtn = el("button", "small-btn", "移除");
    removeBtn.type = "button";
    removeBtn.title = "从列表移除该机器（吊销其凭证并删除记录）";
    removeBtn.addEventListener("click", async () => {
      if (!confirm("移除 " + (a.hostname || a.agentId) + "?\n吊销其接入凭证并从列表删除。")) return;
      try {
        await api("/api/agents/remove", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ agentId: a.agentId }) });
        toast("已移除 " + (a.hostname || a.agentId));
        await refresh();
      } catch (e) { toast("移除失败：" + e.message); }
    });
    line.append(revoke, removeBtn);
    list.append(line);
  });
  const joinBtn = el("button", "small-btn", "＋ 接入新机器");
  joinBtn.type = "button"; joinBtn.addEventListener("click", openJoin);
  const foot = el("div"); foot.style.padding = "10px 4px 0"; foot.append(joinBtn);
  list.append(foot);
}

function renderAgentsError(msg) {
  const list = $("agent-list"); clear(list);
  const box = el("div", "small");
  box.append(el("span", null, "机器列表加载失败：" + msg + "　"));
  const retry = el("button", "small-btn", "重试");
  retry.type = "button"; retry.addEventListener("click", loadAgents);
  box.append(retry);
  list.append(box);
}
async function loadAgents() {
  const btn = $("btn-join-top");
  try {
    const d = await api("/api/agents");
    btn.classList.remove("hidden");
    renderAgents(d.agents || [], false);
  } catch (e) {
    if (e.code === "agents-disabled") {
      btn.classList.add("hidden");
      renderAgents([], true);
    }
    else if (e.status === 401) return;   // 401 由 refresh 统一处理
    else renderAgentsError(e.message);
  }
}

/* ---------- write actions: collect / dispatch / resolve ---------- */
function confirmCollect(agent) {
  $("confirm-title").textContent = "收取 " + (agent.hostname || agent.agentId);
  $("confirm-desc").textContent = "把 " + (agent.hostname || agent.agentId) + " 的配置存入中心存储。其他机器这次不动。";
  $("confirm-choices").replaceChildren();
  $("btn-confirm-ok").textContent = "确认收取";
  app.pendingAction = { kind: "collect", agentId: agent.agentId, name: agent.hostname || agent.agentId };
  $("dlg-confirm").showModal();
}
function confirmDispatch(agent) {
  $("confirm-title").textContent = "下发到 " + (agent.hostname || agent.agentId);
  $("confirm-desc").textContent = "用中心存储的当前内容更新 " + (agent.hostname || agent.agentId) + " 上的对应文件，覆盖前先备份。其他机器这次不动。";
  $("confirm-choices").replaceChildren();
  $("btn-confirm-ok").textContent = "确认下发";
  app.pendingAction = { kind: "dispatch-one", agentId: agent.agentId, name: agent.hostname || agent.agentId };
  $("dlg-confirm").showModal();
}
function confirmStorageSync() {
  const c = app.console;
  let push = 0, pull = 0;
  (c.machines || []).forEach(m => {
    if (m.stale || !m.drift) return;
    push += m.drift.push || 0;
    pull += m.drift.pull || 0;
  });
  $("confirm-title").textContent = "处理改动";
  $("confirm-desc").textContent = "存储当前为第 " + c.generation + " 代。未收取 " + push + " 项，待下发 " + pull + " 项。";
  $("confirm-choices").replaceChildren();
  $("btn-confirm-ok").textContent = "确认处理";
  app.pendingAction = { kind: "sync-storage" };
  $("dlg-confirm").showModal();
}
function confirmResolveOn(choice, agent) {
  const local = choice === "local";
  const n = agent.drift ? agent.drift.conflicts : 0;
  $("confirm-title").textContent = local ? "以这台机器为准" : "以中心为准";
  $("confirm-desc").textContent = local
    ? "把 " + (agent.hostname || agent.agentId) + " 上的内容保留并写入中心存储，然后下发给其他在线机器。"
    : "用中心存储的内容覆盖 " + (agent.hostname || agent.agentId) + " 上的对应文件，覆盖前先备份。其他机器不动。";
  $("confirm-choices").replaceChildren();
  $("btn-confirm-ok").textContent = local ? "确认以这台机器为准" : "确认以中心为准";
  app.pendingAction = { kind: "resolve-on", choice, agentId: agent.agentId };
  $("dlg-confirm").showModal();
}

$("dlg-confirm").addEventListener("close", () => { app.pendingAction = null; });
// 显式接线，不依赖 dialog 表单的隐式提交行为（兼容性兜底）
$("btn-confirm-ok").addEventListener("click", ev => {
  ev.preventDefault();
  const okBtn = $("btn-confirm-ok");
  okBtn.disabled = true; okBtn.textContent = "处理中…";
  // 直接执行（close→事件→fetch 的链路在 headless 环境会丢事件），
  // 然后关对话框；真实浏览器与 headless 行为一致
  $("dlg-confirm").returnValue = "confirm";
  const action = app.pendingAction;
  $("dlg-confirm").close("confirm");
  app.pendingAction = null;
  if (action && action.kind === "collect") executeCollect(action.agentId, action.name);
  if (action && action.kind === "dispatch-one") executeDispatchOne(action.agentId, action.name);
  if (action && action.kind === "sync-storage") executeStorageSync();
  if (action && action.kind === "resolve-on") executeResolveOn(action.choice, action.agentId);
});
$("btn-confirm-cancel").addEventListener("click", ev => {
  ev.preventDefault();
  $("dlg-confirm").close("cancel");
});
async function executeCollect(agentId, name) {
  const okBtn = $("btn-confirm-ok");
  try {
    const d = await api("/api/sync?direction=collect&agent=" + encodeURIComponent(agentId) + "&confirm=true", { method: "POST" });
    if (d.ok) toast("已从 " + name + " 收取，存入中心");
    else {
      const lines = (d.errors || []).concat((d.agents || []).filter(a => a.error).map(a => a.error));
      showAlert("收取没有完成", lines.length ? lines : ["收取没有完成。"], null);
    }
    await refresh();
  } catch (e) {
    if (e.code === "secrets-rejected") {
      showAlert("已停止：检测到疑似密钥", e.errors, null);
    } else {
      showAlert("收取没有完成", e.errors && e.errors.length ? e.errors : [e.message], null);
    }
  } finally { okBtn.disabled = false; okBtn.textContent = "确认"; }
}
async function executeDispatchOne(agentId, name) {
  const okBtn = $("btn-confirm-ok");
  try {
    const d = await api("/api/agents/" + encodeURIComponent(agentId) + "/pull?confirm=true", { method: "POST" });
    if (d.ok) toast("已下发到 " + name);
    else {
      const lines = (d.errors || []);
      showAlert("下发没有完成", lines.length ? lines : [name + "没有应用这次下发。"], null);
    }
    await refresh();
  } catch (e) {
    showAlert("下发没有完成", e.errors && e.errors.length ? e.errors : [e.message], null);
  } finally { okBtn.disabled = false; okBtn.textContent = "确认"; }
}
async function executeStorageSync() {
  const okBtn = $("btn-confirm-ok");
  try {
    const c = app.console;
    // 先收取有未收改动的在线机器（一台一台来，每台都更新存储），
    // 最后统一下发。
    const toCollect = (c.machines || []).filter(m => !m.stale && m.drift && m.drift.push > 0);
    const failures = [];
    for (const m of toCollect) {
      try {
        const d = await api("/api/sync?direction=collect&agent=" + encodeURIComponent(m.agentId) + "&confirm=true", { method: "POST" });
        if (!d.ok) failures.push((m.hostname || m.agentId) + " 收取失败");
      } catch (e) { failures.push((m.hostname || m.agentId) + " 收取失败：" + e.message); }
    }
    let dispatchMsg = null;
    try {
      const d = await api("/api/sync?direction=dispatch&confirm=true", { method: "POST" });
      if (!d.ok) {
        const lines = (d.errors || []).concat((d.agents || []).filter(a => a.error).map(a => a.error));
        failures.push(...(lines.length ? lines : ["下发没有全部完成。"]));
      } else dispatchMsg = "已下发到所有在线机器";
    } catch (e) { failures.push(e.message); }
    if (failures.length) showAlert("同步没有全部完成", failures, null);
    else toast(dispatchMsg || "已处理全部改动");
    await refresh();
  } finally { okBtn.disabled = false; okBtn.textContent = "确认"; }
}
async function executeResolveOn(choice, agentId) {
  const okBtn = $("btn-confirm-ok");
  try {
    const d = await api("/api/resolve?choice=" + choice + "&agent=" + encodeURIComponent(agentId) + "&confirm=true", { method: "POST" });
    if (d.ok) toast(choice === "local" ? "已保留该机器的内容并写入中心" : "已按中心内容更新该机器");
    else {
      const lines = (d.errors || []).concat((d.agents || []).filter(a => a.error).map(a => a.error));
      showAlert("裁决没有完成", lines.length ? lines : ["裁决没有完成。"], null);
    }
    await refresh();
  } catch (e) {
    showAlert("裁决没有完成", e.errors && e.errors.length ? e.errors : [e.message], null);
  } finally { okBtn.disabled = false; okBtn.textContent = "确认"; }
}

/* ---------- page-level alert ---------- */
function showAlert(title, lines, hint) {
  clearAlert();
  const box = el("div", "inline-banner");
  box.setAttribute("role", "alert");
  const x = el("button", "text close-x", "关闭");
  x.type = "button"; x.addEventListener("click", clearAlert);
  box.append(x, el("h3", null, title));
  if (lines && lines.length) {
    const ul = el("ul");
    lines.forEach(l => ul.append(el("li", null, l)));
    box.append(ul);
  }
  if (hint) box.append(el("p", "small muted", hint));
  $("alert-slot").append(box);
}
function clearAlert() { clear($("alert-slot")); }

/* ---------- join dialog ---------- */
async function openJoin() {
  const dlg = $("dlg-join");
  $("copy-fallback").classList.add("hidden");
  $("btn-copy").textContent = "复制";
  $("join-cmd").value = "获取中…";
  dlg.showModal();
  try {
    const d = await api("/api/auth/join");
    $("join-cmd").value = d.command;
  } catch (e) {
    $("join-cmd").value = "";
    toast("获取接入命令失败：" + e.message);
    dlg.close();
  }
}
$("btn-copy").addEventListener("click", async () => {
  const input = $("join-cmd");
  try {
    await navigator.clipboard.writeText(input.value);
    $("btn-copy").textContent = "已复制 ✓";
    setTimeout(() => $("btn-copy").textContent = "复制", 2000);
  } catch (_) {
    // http 内网 clipboard 不可用 → 降级为全选手动复制
    input.focus(); input.select();
    $("copy-fallback").classList.remove("hidden");
  }
});
$("btn-join-top").addEventListener("click", openJoin);
// 「完成」：关闭对话框并立即刷新——新机器此刻应该已经出现在列表里
// （若 agent 还在安装/启动，几秒后 30s 轮询也会补上）。
$("dlg-join").addEventListener("close", () => { refresh(); });

/* ---------- refresh orchestration ---------- */
function stampRefresh(failed) {
  const t = new Date();
  const hh = String(t.getHours()).padStart(2, "0"), mm = String(t.getMinutes()).padStart(2, "0"), ss = String(t.getSeconds()).padStart(2, "0");
  $("refreshed-at").textContent = failed
    ? hh + ":" + mm + " 刷新失败，下次自动重试"
    : hh + ":" + mm + ":" + ss + " 已刷新";
  $("refreshed-at").style.color = failed ? "var(--ink-dim)" : "";
}

async function refresh() {
  try {
    const [consoleView, agents] = await Promise.all([
      api("/api/console"),
      api("/api/agents"),
    ]);
    showWorkspace();
    app.console = consoleView;
    renderHero();
    loadAgentsRender(agents.agents || [], false);
    stampRefresh(false);
  } catch (e) {
    if (e.status === 401) {
      showGate("login", "会话已过期，请重新登录");
      return;
    }
    showWorkspace();
    renderHeroError(e.message);
    stampRefresh(true);
  }
}
function loadAgentsRender(agents, disabledFeature) {
  renderAgents(agents, disabledFeature);
}
function renderHeroError(msg) {
  const hero = $("hero"); clear(hero); hero.classList.remove("warn"); hero.classList.add("warn");
  const concl = el("p", "conclusion");
  concl.append(el("span", "dot conflict"), document.createTextNode("状态加载失败"));
  hero.append(concl, el("p", "numbers", msg));
  const retry = el("button", null, "重试");
  retry.type = "button"; retry.addEventListener("click", refresh);
  hero.append(retry);
}

/* ---------- auth forms ---------- */
$("form-setup").addEventListener("submit", async ev => {
  ev.preventDefault();
  const pw = $("in-setup-pw").value, pw2 = $("in-setup-pw2").value;
  const err = $("err-setup"); err.textContent = "";
  $("in-setup-pw").removeAttribute("aria-invalid"); $("in-setup-pw2").removeAttribute("aria-invalid");
  if (pw !== pw2) {
    err.textContent = "两次输入不一致";
    $("in-setup-pw2").setAttribute("aria-invalid", "true"); $("in-setup-pw2").focus();
    return;
  }
  const btn = $("btn-setup"); btn.disabled = true; btn.textContent = "保存中…";
  try {
    const body = { password: pw };
    const code = $("in-setup-code").value.trim();
    if (code) body.setupCode = code;
    await api("/api/auth/setup", { method: "POST", body });
    toast("密码已设置");
    await refresh();
  } catch (e) {
    err.textContent = e.message;
    if (e.code === "setup-code-required") $("row-setup-code").classList.remove("hidden");
  } finally { btn.disabled = false; btn.textContent = "保存并进入"; }
});
$("form-login").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = $("err-login"); err.textContent = "";
  const btn = $("btn-login"); btn.disabled = true; btn.textContent = "登录中…";
  try {
    await api("/api/auth/login", { method: "POST", body: { password: $("in-login-pw").value } });
    $("in-login-pw").value = "";
    toast("已登录");
    await refresh();
  } catch (e) {
    err.textContent = e.message;
    $("in-login-pw").setAttribute("aria-invalid", "true");
    $("in-login-pw").focus();
  } finally { btn.disabled = false; btn.textContent = "登录"; }
});
$("btn-logout").addEventListener("click", async () => {
  try { await api("/api/auth/logout", { method: "POST" }); } catch (_) {}
  app.console = null;
  showGate("login");
});
$("btn-refresh").addEventListener("click", refresh);

/* ---------- boot ---------- */
async function boot() {
  try {
    const gate = await api("/api/auth/status");
    if (!gate.configured) {
      showGate("setup");
      $("row-setup-code").classList.toggle("hidden", !gate.setupCodeRequired);
      return;
    }
  } catch (e) {
    showGate("login", "无法连接服务：" + e.message);
    return;
  }
  // configured: probe with a status call — 401 routes to login, success
  // renders the workspace directly (no separate "authed" flag on the server).
  await refresh();
}
boot();

/* ---------- auto refresh (30s, pauses when hidden) ---------- */
setInterval(() => { if (!document.hidden) refresh(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
